name: Publicar Meu Fluxo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Preparar OCR português para execução local
        run: |
          npm install --prefix "$RUNNER_TEMP/meu-fluxo-ocr" --no-audit --no-fund --ignore-scripts --no-save \
            tesseract.js@7.0.0 tesseract.js-core@7.0.0 @tesseract.js-data/por@1.0.0
          DEPS="$RUNNER_TEMP/meu-fluxo-ocr/node_modules"
          DEST="meu-fluxo-app/vendor/ocr"
          mkdir -p "$DEST/core" "$DEST/lang"
          cp "$DEPS/tesseract.js/dist/tesseract.min.js" "$DEST/tesseract.min.js"
          cp "$DEPS/tesseract.js/dist/worker.min.js" "$DEST/worker.min.js"
          cp "$DEPS"/tesseract.js-core/tesseract-core*.wasm.js "$DEST/core/"
          cp "$DEPS"/tesseract.js-core/tesseract-core*.wasm "$DEST/core/"
          cp "$DEPS/@tesseract.js-data/por/4.0.0_best_int/por.traineddata.gz" "$DEST/lang/por.traineddata.gz"
          test -s "$DEST/tesseract.min.js"
          test -s "$DEST/worker.min.js"
          test -s "$DEST/core/tesseract-core-simd-lstm.wasm.js"
          test -s "$DEST/lang/por.traineddata.gz"
          gzip -t "$DEST/lang/por.traineddata.gz"
      - name: Verificar sintaxe e executar testes
        run: |
          node --check meu-fluxo-app/app.js
          node --check meu-fluxo-app/sw.js
          node --check meu-fluxo-app/chat-parser.js
          node --check meu-fluxo-app/backup-v2.js
          node --check meu-fluxo-app/finance-v13.js
          node --check meu-fluxo-app/finance-ui-v13.js
          node --check meu-fluxo-app/receipts-v14.js
          node --check meu-fluxo-app/receipts-ui-v14.js
          node --check meu-fluxo-app/receipt-multipage-v15.js
          node --check meu-fluxo-app/receipt-capture-v15.js
          node --check meu-fluxo-app/receipt-hybrid-v15.js
          node --check meu-fluxo-app/receipt-ai-v15.js
          node --check meu-fluxo-app/receipt-hybrid-ui-v15.js
          node --test meu-fluxo-app/tests/*.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./meu-fluxo-app
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
