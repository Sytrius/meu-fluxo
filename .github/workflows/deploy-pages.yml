name: Publicar Meu Fluxo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Verificar sintaxe e executar testes
        run: |
          node --check meu-fluxo-app/app.js
          node --check meu-fluxo-app/sw.js
          node --check meu-fluxo-app/chat-parser.js
          node --check meu-fluxo-app/backup-v2.js
          node --check meu-fluxo-app/finance-v13.js
          node --check meu-fluxo-app/finance-ui-v13.js
          node --test meu-fluxo-app/tests/*.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./meu-fluxo-app
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
