name: Publicar APK de testes Sytrius Fluxo
on:
  workflow_run:
    workflows: ['Sytrius Fluxo Android - gerar APK']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: SytriusFluxo-Android
          path: release
      - name: Verificar checksum, configuração e commit
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd release
          sed 's#android-app/dist/##' SHA256.txt | sha256sum -c -
          grep -Fx "Commit: $BUILD_SHA" BUILD.txt
          grep -Fx 'Firebase Android: configured' BUILD.txt || { echo 'Publicação bloqueada: configure GOOGLE_SERVICES_JSON; compilação não comprova login.'; exit 1; }
      - name: Publicar APK verificável
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ADS_MODE="$(sed -n 's/^AdMob: //p' release/BUILD.txt)"
          case "$ADS_MODE" in
            test) ADS_NOTE='Esta versão usa anúncios de teste do Google. Eles não geram receita.' ;;
            live) ADS_NOTE='A veiculação e a receita dependem da aprovação e disponibilidade de anúncios no AdMob.' ;;
            *) echo 'Modo AdMob ausente ou inválido no artefato.'; exit 1 ;;
          esac
          gh release create "android-preview-0.9-${BUILD_SHA:0:8}" \
            release/SytriusFluxo-Android.apk release/SHA256.txt release/BUILD.txt release/LEIA-ME.md \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --prerelease \
            --title "Sytrius Fluxo 0.9 — nova identidade visual" \
            --notes "O Meu Fluxo agora é Sytrius Fluxo. A atualização inclui a paleta e o símbolo S/F na interface e no Android. Instale sobre a versão anterior para conservar seus dados. $ADS_NOTE"
