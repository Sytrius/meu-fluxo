name: Publicar APK de testes Meu Fluxo
on:
  workflow_run:
    workflows: ['Meu Fluxo Android - gerar APK']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: MeuFluxo-Android-Preview
          path: release
      - name: Verificar checksum, configuração e commit
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd release
          sed 's#android-app/dist/##' SHA256.txt | sha256sum -c -
          grep -Fx "Commit: $BUILD_SHA" BUILD.txt
          grep -Fx 'Firebase Android: configured' BUILD.txt || { echo 'Publicação bloqueada: configure GOOGLE_SERVICES_JSON; compilação não comprova login.'; exit 1; }
      - name: Publicar APK verificável
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "android-preview-0.6-${BUILD_SHA:0:8}" \
            release/MeuFluxo-Android-Preview.apk release/SHA256.txt release/BUILD.txt release/LEIA-ME.md \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --prerelease \
            --title 'Meu Fluxo Android 0.6 — importar lista CSV ou XLSX' \
            --notes 'Compilação Gradle e testes automatizados aprovados. Nova lista da nota por arquivo CSV/XLSX, link externo para Gemini e revisão antes de registrar. Fotos antigas salvas são preservadas. A planilha enviada pelo usuário foi testada localmente: 27 produtos e R$ 272,48. O APK ainda precisa de teste no aparelho real. Faça backup antes de atualizar; a assinatura é a mesma dos previews 0.2 a 0.5.'
