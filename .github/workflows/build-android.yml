name: Meu Fluxo Android - gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'meu-fluxo-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: meu-fluxo-android
  cancel-in-progress: true

jobs:
  apk:
    name: Testar e compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verificar o PWA existente
        run: |
          node --check meu-fluxo-app/app.js
          node --test meu-fluxo-app/tests/*.cjs

      - name: Instalar dependências Android e ML Kit
        run: |
          npm install --prefix android-app --no-audit --no-fund
          node --check android-app/src/native.mjs
          node --check android-app/scripts/prepare-web.mjs

      - name: Criar pacote offline e ponte nativa
        run: node android-app/scripts/prepare-web.mjs

      - name: Empacotar leitor OCR português para uso local
        run: |
          npm install --prefix "$RUNNER_TEMP/meu-fluxo-ocr" --no-audit --no-fund --ignore-scripts --no-save \
            tesseract.js@7.0.0 tesseract.js-core@7.0.0 @tesseract.js-data/por@1.0.0
          DEPS="$RUNNER_TEMP/meu-fluxo-ocr/node_modules"
          DEST="android-app/www/vendor/ocr"
          mkdir -p "$DEST/core" "$DEST/lang"
          cp "$DEPS/tesseract.js/dist/tesseract.min.js" "$DEST/tesseract.min.js"
          cp "$DEPS/tesseract.js/dist/worker.min.js" "$DEST/worker.min.js"
          cp "$DEPS"/tesseract.js-core/tesseract-core*.wasm.js "$DEST/core/"
          cp "$DEPS"/tesseract.js-core/tesseract-core*.wasm "$DEST/core/"
          cp "$DEPS/@tesseract.js-data/por/4.0.0_best_int/por.traineddata.gz" "$DEST/lang/por.traineddata.gz"
          test -s "$DEST/lang/por.traineddata.gz"

      - name: Gerar projeto Android nativo
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android
      - name: Aplicar privacidade e permissões
        run: node android-app/scripts/patch-android.mjs
      - name: Aplicar logo Meu Fluxo
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('meu-fluxo-app/icons/icon-512.png')
          im=Image.open(src).convert('RGBA')
          base=Path('android-app/android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              dest=base/('mipmap-'+density)
              dest.mkdir(parents=True,exist_ok=True)
              im.resize((size,size),Image.Resampling.LANCZOS).save(dest/'ic_launcher.png')
              im.resize((size,size),Image.Resampling.LANCZOS).save(dest/'ic_launcher_round.png')
          PY

      - name: Compilar APK de testes
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar instalador de testes
        run: |
          mkdir -p android-app/dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk android-app/dist/MeuFluxo-Android-Preview.apk
          sha256sum android-app/dist/MeuFluxo-Android-Preview.apk > android-app/dist/SHA256.txt
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuFluxo-Android-Preview
          path: |
            android-app/dist/MeuFluxo-Android-Preview.apk
            android-app/dist/SHA256.txt
          retention-days: 30
          if-no-files-found: error
